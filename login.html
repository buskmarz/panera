<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login · Panera Signature</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background: #f7fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: white;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-card h1 {
            color: #2B4E59;
            margin-bottom: 1.5rem;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 1rem;
            border: 1px solid #e2e8f0;
            border-radius: 0.5rem;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #2B4E59;
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #1e3a45;
        }
        .error {
            color: #dc2626;
            font-size: 0.875rem;
            margin-bottom: 1rem;
            display: none;
        }
        .link {
            margin-top: 1rem;
            font-size: 0.875rem;
            color: #66B6CC;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>Panera Signature</h1>
        <div id="error-msg" class="error"></div>
        <form id="login-form">
            <input type="text" id="username" placeholder="Usuario" required>
            <input type="password" id="password" placeholder="Contraseña" required>
            <button type="submit">Iniciar Sesión</button>
        </form>
        <div class="link">Acceso restringido · Solo personal autorizado</div>
    </div>

    <script>
        function getApiPrefix() {
            const host = window.location.hostname;
            if (host === "localhost" || host === "127.0.0.1") return "";
            return "/.netlify/functions/main";
        }
        const API_PREFIX = getApiPrefix();

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error-msg');

            try {
                const endpoint = `${API_PREFIX}/token`;
                const body = new URLSearchParams({ username, password });
                const headers = { 'Content-Type': 'application/x-www-form-urlencoded' };

                const res = await fetch(endpoint, { method: 'POST', headers, body });
                const text = await res.text();
                let data = {};
                try { data = text ? JSON.parse(text) : {}; } catch (e) { data = {}; }

                if (!res.ok) {
                    const detail = data.detail || (text && text.trim().startsWith("<") ? "Servidor no disponible" : "Error en la solicitud");
                    throw new Error(detail);
                }

                localStorage.setItem('panera_token', data.access_token);
                window.location.href = '/';
            } catch (err) {
                errorDiv.textContent = err.message;
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
