<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login · Panera Signature</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background: #f7fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: white;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-card h1 {
            color: #2B4E59;
            margin-bottom: 1.5rem;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 1rem;
            border: 1px solid #e2e8f0;
            border-radius: 0.5rem;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #2B4E59;
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #1e3a45;
        }
        .error {
            color: #dc2626;
            font-size: 0.875rem;
            margin-bottom: 1rem;
            display: none;
        }
        .link {
            margin-top: 1rem;
            font-size: 0.875rem;
            color: #66B6CC;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>Panera Signature</h1>
        <div id="error-msg" class="error"></div>
        <form id="login-form">
            <input type="text" id="username" placeholder="Usuario" required>
            <input type="password" id="password" placeholder="Contraseña" required>
            <button type="submit">Iniciar Sesión</button>
        </form>
        <div class="link" onclick="toggleRegister()">¿No tienes cuenta? Regístrate</div>
    </div>

    <script>
        const API_URL = ""; // Relative path
        let isRegister = false;

        function toggleRegister() {
            isRegister = !isRegister;
            document.querySelector('button').textContent = isRegister ? "Registrarse" : "Iniciar Sesión";
            document.querySelector('.link').textContent = isRegister ? "¿Ya tienes cuenta? Inicia Sesión" : "¿No tienes cuenta? Regístrate";
            document.getElementById('error-msg').style.display = 'none';
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error-msg');

            try {
                const endpoint = isRegister ? '/register' : '/token';
                const body = isRegister 
                    ? JSON.stringify({ username, password })
                    : new URLSearchParams({ username, password });
                
                const headers = isRegister 
                    ? { 'Content-Type': 'application/json' }
                    : { 'Content-Type': 'application/x-www-form-urlencoded' };

                const res = await fetch(endpoint, { method: 'POST', headers, body });
                const data = await res.json();

                if (!res.ok) throw new Error(data.detail || 'Error en la solicitud');

                localStorage.setItem('panera_token', data.access_token);
                window.location.href = '/';
            } catch (err) {
                errorDiv.textContent = err.message;
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
